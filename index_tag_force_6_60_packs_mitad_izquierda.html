<html lang="es">
<head>

<title>Yu-Gi-Oh! — Base de cartas y packs</title>
<style>
:root{--bg:#0d1015;--panel:#151a22;--panel2:#1b222d;--border:#303a48;--text:#edf2f7;--muted:#9ba8b7;--accent:#69a7ff;--danger:#ff7b7b}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit} button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:rgba(13,16,21,.96);border-bottom:1px solid var(--border);backdrop-filter:blur(8px)}
.topin{max-width:1500px;margin:auto;padding:16px 20px}.title{display:flex;align-items:center;justify-content:space-between;gap:15px}.title h1{margin:0;font-size:23px}.status{font-size:13px;color:var(--muted)}
.searchrow{display:flex;gap:10px;margin-top:14px}.search{flex:1;background:#0a0d12;border:1px solid var(--border);color:var(--text);border-radius:9px;padding:13px 14px;outline:none}.search:focus{border-color:var(--accent)}
.gameTabs{display:flex;gap:8px;margin-top:12px}.gameTab{background:#10151d;color:var(--muted);border:1px solid var(--border);border-radius:9px;padding:9px 13px}.gameTab.active{color:var(--text);background:#25364d;border-color:var(--accent)}
.nav{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.nav button,.back{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 12px}.nav button:hover,.back:hover{border-color:#60748c}
main{max-width:1500px;margin:auto;padding:22px 20px}.notice{padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--muted);margin-bottom:18px}.notice strong{color:var(--text)}
.card.rarity-gold{border:2px solid #ffd21a;background:linear-gradient(180deg,rgba(255,210,26,.30),var(--panel) 34%)}.card.rarity-silver{border:2px solid #e8edf3;background:linear-gradient(180deg,rgba(232,237,243,.28),var(--panel) 34%)}.card.rarity-bronze{border:2px solid #d9873f;background:linear-gradient(180deg,rgba(217,135,63,.30),var(--panel) 34%)}.card.rarity-normal{border:2px solid #718096;background:linear-gradient(180deg,rgba(113,128,150,.20),var(--panel) 34%)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px;transition:.12s;cursor:pointer}.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.35)}.thumb{width:100%;aspect-ratio:.69;object-fit:contain;background:#090b0f;border-radius:6px;display:block}.ctitle{font-size:13px;font-weight:bold;margin-top:9px;line-height:1.25}.rarity{font-size:11px;color:var(--muted);margin-top:4px}.missing{display:flex;align-items:center;justify-content:center;text-align:center;color:#7f8996;font-size:12px;aspect-ratio:.69;background:#090b0f;border-radius:6px;padding:8px}
.packgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.pack{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;cursor:pointer}.packimg{width:100%;aspect-ratio:1/1.25;object-fit:contain;background:#090b0f;border-radius:7px;display:block;margin-bottom:10px}
/* Tag Force 6: mostrar solo la mitad izquierda de cada portada local. */
.tf6-packart{width:100%;aspect-ratio:1/1.25;overflow:hidden;position:relative;background:#090b0f;border-radius:7px;margin-bottom:10px}
.tf6-packart .packimg{width:200%;height:100%;max-width:none;max-height:none;aspect-ratio:auto;object-fit:fill;object-position:left center;border-radius:0;margin:0}
.pack:hover .packimg{filter:brightness(1.08)}.pack:hover{border-color:#6683a5}.packnum{color:var(--accent);font-size:12px}.packname{font-weight:bold;margin:5px 0 9px}.packmeta{color:var(--muted);font-size:12px;line-height:1.45}
.detail{display:grid;grid-template-columns:minmax(280px,460px) 1fr;gap:28px;align-items:start}.largewrap{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}.large{width:min(100%,460px);max-height:78vh;object-fit:contain;border-radius:8px;cursor:zoom-in}.zoomhint{font-size:12px;color:var(--muted);margin-top:8px}.info{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px}.info h2{margin:0 0 14px;font-size:25px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{background:var(--panel2);border-radius:8px;padding:10px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.value{margin-top:4px;white-space:pre-wrap;word-break:break-word}.desc{margin-top:14px;background:var(--panel2);padding:13px;border-radius:8px;line-height:1.5;white-space:pre-wrap}.packsin{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.tag{background:#253043;border:1px solid #3b4b60;border-radius:999px;padding:5px 9px;font-size:12px;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:50px 10px}.loading{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:800px){.detail{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.large{max-height:60vh}.title{align-items:flex-start;flex-direction:column}}

.cardmodal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}.cardmodalbox{width:min(1150px,96vw);max-height:94vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 20px 80px #000}.cardmodalgrid{display:grid;grid-template-columns:minmax(300px,460px) 1fr;gap:28px;align-items:start}.cardmodalimg{width:100%;max-height:78vh;object-fit:contain;display:block;border-radius:10px;cursor:pointer}.cardmodalclose{float:right;font-size:32px;line-height:28px;border:0;background:none;color:#fff;cursor:pointer}@media(max-width:800px){.cardmodalgrid{grid-template-columns:1fr}.cardmodalimg{max-height:60vh}}

.missingreport{display:grid;gap:8px;margin-top:16px}.missingrow{padding:12px 14px;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:rgba(255,255,255,.04)}.missingrow code{font-family:Consolas,monospace}.missingrow span{opacity:.9}
.missingapimodal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:18px}.missingapibox{width:min(760px,96vw);max-height:92vh;display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 20px 80px #000}.missingapitop{display:flex;align-items:center;justify-content:space-between;gap:12px}.missingapitop h2{font-size:18px;margin:0}.missingapitext{width:100%;min-height:260px;flex:1;resize:vertical;background:#090d13;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px;font:13px/1.5 Consolas,monospace}.missingapiactions{display:flex;flex-wrap:wrap;gap:8px}.missingapiactions button,.missingapiclose{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 11px}.missingapihint{color:var(--muted);font-size:12px}
</style>

function dtRarityColor(rarity){
  const r=String(rarity||'').toLowerCase();
  if(/ultra|secret|ghost|ultimate|gold|parallel|prismatic|platinum/.test(r)) return 'Gold';
  if(/super/.test(r)) return 'Silver';
  if(/rare/.test(r)) return 'Bronze';
  return 'Normal';
}
function parseDuelTranserTxt(text){
  const lines=String(text||'').replace(/\r/g,'').split('\n');
  const starts=[];
  for(let i=0;i<lines.length;i++){
    const title=lines[i].trim();
    if(!title) continue;
    const next=lines.slice(i+1,i+2).map(x=>x.trim());
    const looksLikePack=next.length===1 && /^URL:\s*https?:\/\//i.test(next[0]);
    if(looksLikePack) starts.push(i);
  }
  const packs=[];
  const rarityHeader=/^(.+?)\s*-\s*(\d+)\s+cartas?\s*$/i;
  for(let p=0;p<starts.length;p++){
    const start=starts[p], end=p+1<starts.length?starts[p+1]:lines.length;
    const section=lines.slice(start,end);
    const title=section[0].trim().replace(/\s*\(Duel\s+Transer\)\s*$/i,'').trim();
    if(!title) continue;
    let unlock='', inUnlock=false, currentRarity='', cards=[];
    for(let j=1;j<section.length;j++){
      const raw=section[j], line=raw.trim();
      if(/^URL:\s*/i.test(line)) continue;
      if(/^Como se consigue:\s*$/i.test(line)){inUnlock=true;continue;}
      const rm=line.match(rarityHeader);
      if(rm){currentRarity=rm[1].trim();inUnlock=false;continue;}
      if(!line) continue;
      if(inUnlock && !currentRarity){unlock+=(unlock?'\n':'')+line;continue;}
      if(currentRarity){
        // Las cartas aparecen como líneas indentadas bajo cada encabezado de rareza.
        if(/^\s{2,}\S/.test(raw)) cards.push({name:line,rarity:dtRarityColor(currentRarity),raritySource:currentRarity});
      }
    }
    // Evita tratar una línea de diagnóstico o una sección vacía como un pack válido.
    if(packs.some(x=>x.name.toLowerCase()===title.toLowerCase())) continue;
    packs.push({num:packs.length+1,name:title,unlock:unlock||'No indicado en el TXT',desc:'',cards});
  }
  if(!packs.length) throw new Error('No se detectaron packs en Duel_Transer_packs.txt');
  return packs;
}
async function loadDuelTranserFromTxt(){
  let lastError;
  for(const url of DUEL_TRANSER_TXT_URLS){
    try{
      const response=await fetch(url,{cache:'no-store'});
      if(!response.ok) throw new Error('HTTP '+response.status);
      const text=await response.text();
      const packs=parseDuelTranserTxt(text);
      if(packs.length<40) throw new Error('El TXT solo produjo '+packs.length+' packs; se conserva la base anterior.');
      DUEL_TRANSER_PACKS=packs;
      console.info('Duel Transer: '+packs.length+' packs cargados desde el TXT.');
      return true;
    }catch(e){lastError=e;}
  }
  console.warn('No se pudo actualizar la base de Duel Transer desde el TXT; se mantiene la base integrada.',lastError);
  return false;
}

function editDistance(a,b){
 const prev=Array.from({length:b.length+1},(_,i)=>i);let cur=[];
 for(let i=1;i<=a.length;i++){cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));for(let j=0;j<=b.length;j++)prev[j]=cur[j]}
 return prev[b.length];
}
function fuzzyApiCard(name){
 const key=norm(name);if(fuzzyCache.has(key))return fuzzyCache.get(key);
 if(!key||!apiCards.length)return null;
 // La búsqueda difusa sólo se usa si falla el nombre exacto. Evita asignar una carta distinta si hay dos candidatas casi iguales.
 const tokens=key.match(/[a-z0-9]+/g)||[];let best=null,second=0,bestScore=0;
 for(const c of apiCards){
   const cn=norm(c.name);if(!cn)continue;
   const ct=cn.match(/[a-z0-9]+/g)||[];
   const firstA=tokens[0]||'',firstB=ct[0]||'';
   if(firstA&&firstB&&firstA!==firstB&&firstA.slice(0,2)!==firstB.slice(0,2)&&Math.abs(firstA.length-firstB.length)>1)continue;
   if(Math.abs(key.length-cn.length)>Math.max(5,Math.floor(key.length*.24)))continue;
   const shared=tokens.filter(t=>ct.includes(t)&&t.length>2).length;
   const d=editDistance(key,cn);const score=1-d/Math.max(key.length,cn.length);
   if(score<0.72)continue;
   const need=tokens.length<=1?0:Math.min(2,tokens.length-1);
   if(shared<need && score<0.94)continue;
   if(score>bestScore){second=bestScore;bestScore=score;best=c}else if(score>second)second=score;
 }
 const min=key.length<9?0.88:0.79;
 const result=best&&bestScore>=min&&(bestScore-second>=0.018||bestScore>=0.94)?best:null;
 fuzzyCache.set(key,result);return result;
}

 const mem=memberships.get(norm(name))||[];
 if(currentView==='pack'&&currentPackNum){const x=mem.find(v=>v.num===currentPackNum);if(x)return x.rarity}

}
function cardResults(q){
 const n=norm(q); if(!n)return [];
 let allowed=currentView==='pack'&&currentPackNum?cardsInPack(currentPackNum):activePacks().flatMap(p=>p.cards);
 const out=[]; const seen=new Set();
 for(const src of allowed){
   const c=findApiForSource(src.name);
   const sourceMatch=norm(src.name).includes(n);
   const apiMatch=c && norm(c.name+' '+(c.desc||'')+' '+(c.type||'')+' '+(c.race||'')+' '+(c.attribute||'')).includes(n);
   if((sourceMatch||apiMatch)&&!seen.has(norm(src.name))){out.push({source:src,card:c});seen.add(norm(src.name));}
 }
 return out.sort((a,b)=>{const an=norm(a.source.name),bn=norm(b.source.name);return (an===n?0:an.startsWith(n)?1:2)-(bn===n?0:bn.startsWith(n)?1:2)||a.source.name.localeCompare(b.source.name)})
}
function cardTile(c,source=null){

 const displayName=sourceName||apiCard?.name||'Carta';
 const mem=memberships.get(norm(displayName))||[]; const img=imageOf(apiCard); const rarity=source?.rarity||rarityForCard(displayName);
 const rarityText=currentView==='pack'&&currentPackNum ? rarity : mem.filter(x=>x.num!==16&&x.num!==48).sort((a,b)=>b.num-a.num).map(x=>'P'+String(x.num).padStart(2,'0')+': '+x.rarity).join(' · ');
 const clickName=esc(JSON.stringify(sourceName)); const shownName=apiCard?.name||displayName;

}

function packImageFallback(img){
 const next=img.dataset.fallback1;
 if(next){img.dataset.fallback1='';img.src=next;return}
 const last=img.dataset.fallback2;
 if(last){img.dataset.fallback2='';img.src=last;return}
 img.onerror=null;img.style.display='none';
}
function packArt(p){
 const local=packImage(p);
 if(currentGame==='tf2')return `<div class="packart"><div class="packplaceholder">${esc(p.name)}</div><img class="packimg" src="${esc(local)}" alt="${esc(p.name)}" onerror="this.style.display='none'"></div>`;
 if(currentGame==='tf6'){
   const png=local.replace(/\.jpg$/i,'.png'), webp=local.replace(/\.jpg$/i,'.webp');
   return `<div class="packart tf6-packart"><img class="packimg" src="${esc(local)}" data-fallback1="${esc(png)}" data-fallback2="${esc(webp)}" alt="${esc(p.name)}" onerror="packImageFallback(this)"></div>`;
 }
 // Duel Transer: portada local numerada; si falta el JPG, se muestra una portada genérica.
 const fallback=generatedPackCover(p);
 return `<div class="packart"><img class="packimg" src="${esc(local)}" data-fallback2="${esc(fallback)}" alt="${esc(p.name)}" onerror="packImageFallback(this)"></div>`;
}
function setPackBackButton(visible){const b=document.getElementById('backPacks');if(b)b.style.display=visible?'inline-block':'none'}
function showPacks(push=true){
 currentView='packs';currentPackNum=null;currentCard=null;document.getElementById('search').value='';setPackBackButton(false);
 if(push) history.pushState({game:currentGame,view:'packs'},'',location.pathname+'?game='+currentGame);
 const app=document.getElementById('app');const packs=activePacks();
 const intro=currentGame==='tf2'?'Las listas incluyen los packs del juego; los packs 16 y 48 representan colecciones especiales.':currentGame==='dt'?'Packs, rarezas y condiciones de desbloqueo cargados desde Duel_Transer_packs.txt. Las portadas se leen desde images/packs-duel-transer/.':'60 sobres de Tag Force 6. Las cartas y rarezas proceden de Yugipedia; los sobres recopilatorios conservan las rarezas de origen y muestran primero las cartas adicionales explícitas. Algunas colecciones dinámicas no se expanden por completo.';
 app.innerHTML=`<div class="notice"><strong>📦 TODOS LOS PACKS — ${packs.length} disponibles</strong><br>${intro}</div><div class="packgrid">${packs.map(p=>`<article class="pack" onclick="openPack(${p.num})">${packArt(p)}<div class="packnum">PACK ${String(p.num).padStart(2,'0')}</div><div class="packname">${esc(p.name)}</div><div class="packmeta">${p.dynamicCollection?(p.cards.length?p.cards.length+' cartas explícitas · colección dinámica':'Colección dinámica'):p.cards.length?p.cards.length+' cartas listadas':esc(p.desc||'Pack especial con selección dinámica de cartas')}</div></article>`).join('')}</div>`
}
function openPack(num,push=true){
 currentView='pack';currentPackNum=num;document.getElementById('search').value='';setPackBackButton(true);
 if(push) history.pushState({game:currentGame,view:'pack',pack:num},'',location.pathname+'?game='+currentGame+'&pack='+num);
 const p=activePacks()[num-1];const app=document.getElementById('app');
 if(!p){showPacks(false);return}
 if(!p.cards.length){const mensaje=currentGame==='tf6'?(p.desc||'La fuente no devolvió una lista de cartas para este sobre. Revisar el registro del generador.'):(p.desc||'Este pack selecciona cartas de otros packs de forma dinámica.');app.innerHTML=`<h2>${esc(p.name)}</h2><div class="notice">${esc(mensaje)}</div>`;return}
 const found=p.cards.filter(x=>findApiForSource(x.name)); const missing=p.cards.filter(x=>!findApiForSource(x.name));
 app.innerHTML=`<h2>${esc(p.name)}</h2><div class="notice">${p.cards.length} cartas listadas · ${found.length} con imagen/API · ${missing.length} sin coincidencia${p.unlock?' · '+esc(p.unlock):''}</div><div class="grid">${p.cards.map(x=>cardTile(findApiForSource(x.name),x)).join('')}</div>`
}
window.addEventListener('popstate',()=>{
 const q=new URLSearchParams(location.search);const game=['dt','tf6'].includes(q.get('game'))?q.get('game'):'tf2';if(game!==currentGame){currentGame=game;document.getElementById('pageTitle').textContent=gameTitle(game);syncGameTabs();buildMembership();}
 const n=Number(q.get('pack'));if(Number.isInteger(n)&&n>=1&&n<=activePacks().length)openPack(n,false);else showPacks(false);
});
function missingApiNamesForPacks(packs){
 const seen=new Set(), missing=[];
 for(const pack of packs){for(const source of (pack.cards||[])){const name=String(source.name||'').trim();if(!name)continue;const key=norm(name);if(seen.has(key))continue;seen.add(key);if(!findApiForSource(name))missing.push(name)}}
 return missing;
}
function closeMissingApiReport(){const m=document.getElementById('missingApiModal');if(m)m.remove()}
function showMissingApiReport(){
 if(!apiCards.length){alert('La API todavía no terminó de cargar. Esperá unos segundos y volvé a intentarlo.');return}
 const missing=missingApiNamesForPacks(activePacks()), gameName=currentGame==='dt'?'Duel Transer':currentGame==='tf6'?'Tag Force 6':'Tag Force 2';
 const old=document.getElementById('missingApiModal');if(old)old.remove();
 const modal=document.createElement('div');modal.id='missingApiModal';modal.className='missingapimodal';
 modal.innerHTML=`<section class="missingapibox" role="dialog" aria-modal="true" aria-labelledby="missingApiTitle"><div class="missingapitop"><h2 id="missingApiTitle">Cartas sin coincidencia en la API — ${esc(gameName)}</h2><button class="missingapiclose" onclick="closeMissingApiReport()" aria-label="Cerrar">×</button></div><div class="missingapihint">${missing.length} nombres únicos. Una carta por línea. Seleccioná y copiá el texto para corregir los nombres.</div><textarea id="missingApiText" class="missingapitext" spellcheck="false" readonly>${esc(missing.join('\n'))}</textarea><div class="missingapiactions"><button onclick="selectMissingApiText()">Seleccionar todo</button><button onclick="copyMissingApiText()">Copiar lista</button><button onclick="closeMissingApiReport()">Cerrar</button></div></section>`;
 document.body.appendChild(modal);modal.addEventListener('click',e=>{if(e.target===modal)closeMissingApiReport()});const ta=document.getElementById('missingApiText');ta.focus();ta.select();
}
function selectMissingApiText(){const ta=document.getElementById('missingApiText');if(ta){ta.focus();ta.select()}}
async function copyMissingApiText(){const ta=document.getElementById('missingApiText');if(!ta)return;ta.focus();ta.select();try{await navigator.clipboard.writeText(ta.value);const b=document.querySelector('.missingapiactions button:nth-child(2)');if(b)b.textContent='Copiado ✓'}catch(e){try{document.execCommand('copy')}catch(_){alert('El texto está seleccionado. Presioná Ctrl+C para copiarlo.')}}}
function closeCardModal(){const m=document.getElementById('cardmodal');if(m)m.remove()}
function openCard(name){
 const c=findApiForSource(name);
 if(!c){const f=activePacks().flatMap(p=>p.cards).find(x=>norm(x.name)===norm(name));if(!f)return;}
 const card=c||{name:name,type:'',desc:'',typeline:[],race:'',atk:'',def:'',level:'',attribute:''};
 const mem=memberships.get(norm(name))||memberships.get(norm(card.name))||[]; const img=imageOf(card); const typ=card.typeline||[];
 const rarity=rarityForCard(card.name); const fields=[['Nombre',card.name],['Rareza',rarity],['Tipo',card.type],['Typeline 1',typ[0]],['Typeline 2',typ[1]],['Typeline 3',typ[2]],['Raza',card.race],['ATK',card.atk],['DEF',card.def],['Nivel / Rango',card.level],['Atributo',card.attribute]];
 const old=document.getElementById('cardmodal');if(old)old.remove();
 const modal=document.createElement('div');modal.id='cardmodal';modal.className='cardmodal';
 modal.innerHTML=`<div class="cardmodalbox"><button class="cardmodalclose" aria-label="Cerrar">×</button><div class="cardmodalgrid"><div>${img?`<img class="cardmodalimg" src="${esc(img)}" alt="${esc(card.name)}">`:`<div class="missing">Imagen no disponible</div>`}</div><section class="info"><h2>${esc(card.name)}</h2><div class="fields">${fields.map(([l,v])=>v!==undefined&&v!==null&&v!==''?`<div class="field"><div class="label">${esc(l)}</div><div class="value">${esc(v)}</div></div>`:'').join('')}</div><div class="desc"><div class="label">Texto / efecto</div><div style="margin-top:7px">${esc(card.desc||'')}</div></div><div class="label" style="margin-top:18px">Aparece en los packs</div><div class="packsin">${mem.map(x=>`<span class="tag" onclick="closeCardModal();openPack(${x.num})">Pack ${String(x.num).padStart(2,'0')} · ${esc(x.name)}</span>`).join('')}</div></section></div></div>`;
 document.body.appendChild(modal);modal.addEventListener('click',closeCardModal)
}
document.getElementById('search').addEventListener('input',()=>{if(currentView==='packs'){} renderSearch()});
async function loadApi(){try{document.getElementById('status').textContent='Actualizando packs de Duel Transer…';await loadDuelTranserFromTxt();buildMembership();document.getElementById('status').textContent='Cargando base de cartas desde YGOPRODeck…';const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),12000);const r=await fetch(API,{cache:'no-store',signal:ctl.signal});clearTimeout(timer);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();apiCards=j.data||[];apiByName=new Map(apiCards.map(c=>[norm(c.name),c]));buildMembership();updateStatus();const q=new URLSearchParams(location.search);const game=['dt','tf6'].includes(q.get('game'))?q.get('game'):'tf2';if(game!==currentGame)switchGame(game,false);else {const n=Number(q.get('pack'));if(Number.isInteger(n)&&n>=1&&n<=activePacks().length)openPack(n,false);else showPacks(false)}}catch(e){document.getElementById('status').textContent='Error al cargar la API';document.getElementById('app').innerHTML=`<div class="notice"><strong>No se pudo cargar la base de cartas.</strong><br>La página necesita acceso a Internet para consultar YGOPRODeck. El error fue: ${esc(e.message)}</div>`}}
buildMembership();const initialGame=new URLSearchParams(location.search).get('game');if(['dt','tf6'].includes(initialGame)){currentGame=initialGame;document.getElementById('pageTitle').textContent=gameTitle(initialGame);syncGameTabs();}showPacks(false);loadApi();
</script>
</body></html>
